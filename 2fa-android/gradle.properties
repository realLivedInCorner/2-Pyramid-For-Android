org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

# AGP 8.11.1 only tested up to compileSdk=36.0; suppress the warning for compileSdk=37/37.0
# (Android 17 SDK ships as android-37.0 per new naming convention).
# Build works fine at 37; AGP just emits a compatibility warning.
android.suppressUnsupportedCompileSdk=37,37.0

kotlin.code.style=official

# Android NDK
android.ndkVersion=27.2.12479018
