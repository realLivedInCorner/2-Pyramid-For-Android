[package]
name = "convert-core"
version = "2.0.0"
description = "2-Pyramid for Android convert-core"
authors = ["2-Pyramid Studio"]
edition = "2021"
license = "MIT"

[lib]
name = "convert_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
tempfile = "3.10.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
dirs = "5"
chrono = "0.4"
uuid = { version = "1.8", features = ["v4", "serde"] }
regex = "1"
lazy_static = "1"
rayon = "1.9"
once_cell = "1.19"
uniffi = { version = "0.32" }

[build-dependencies]
uniffi = { version = "0.32", features = ["bindgen", "build"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# cdylib 必须保留 uniffi_* 导出符号供 uniffi-bindgen 找 metadata block。
# strip = "debuginfo" 只剥 DWARF debug info，不动 function 符号。
# lto = "thin" 跨 crate inline 不破坏 uniffi 导出（实测 0.32 OK）。
[profile.release.package."*"]
strip = "debuginfo"

[profile.dev]
opt-level = 1
