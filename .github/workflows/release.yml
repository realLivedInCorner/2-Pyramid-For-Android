# ===============================================================
# 2-Pyramid for Android — Release workflow
# ===============================================================
# 触发：推送带**渠道前缀**的 tag（与桌面主仓库 2-Pyramid 同一套 tag 约定）：
#
#     Stable-2.1.0     稳定版         → Release 标 --latest
#     Safe-2.1.0       重要安全更新   → Release 标 --latest
#     Beta-2.1.0       测试版         → Release 标 --prerelease
#     UnStable-2.1.0   测试版         → Release 标 --prerelease
#
# 为什么用 tag 而不是 push main：**发布是显式动作**。版本号、BUILD、CHANGELOG、
# 发版说明四者的就绪状态无法在 push 那一刻判定，tag 才是人说「这一版发了」。
# 前缀也不是装饰：桌面更新器按第一个 '-' 之前的段决定通道，Android 侧沿用同一套
# 命名，将来若接入应用内更新，解析规则已经对得上；反过来若只写 `v*`，渠道信息
# 就丢了。
#
# 为什么 BUILD 只读不写：BUILD 是**提交里的固定值**。CI 出的 APK 与本地出的 APK
# 必须是同一个编号，否则无法回答「这个 APK 对应哪次构建」—— 旧的
# version.properties 自动 +1 机制正是在这里失真（同一版本 CI 与本地编号不同），
# 本版已删除。要推进编号用 `python tools/set_version.py --build N`，和版本号一样
# 是显式动作。
#
# 本工作流只在 tag 上跑；PR / main 的日常验证在 build.yml。
# ===============================================================

name: release

on:
  push:
    tags:
      - 'Stable-*'
      - 'Safe-*'
      - 'Beta-*'
      - 'UnStable-*'
  # 刻意不开 workflow_dispatch：Release 必须有 tag。
  # dispatch 触发时 github.ref 是分支名而不是 tag，gh release create 会失败；
  # 手动验证构建用 build.yml 的 dispatch 即可。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # release 不能被打断

permissions:
  contents: write             # 创建 Release 需要写权限（默认 GITHUB_TOKEN 只读）

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # 关键分工：Gradle 只负责打包，Rust 编译由本 workflow 显式跑
      # tools/build-rust-android.sh —— 链路与本地一致（cargo-ndk + uniffi-bindgen），
      # 出错时日志也出现在一个可预期的步骤里，而不是藏在 Gradle task 内部。
      SKIP_RUST_BUILD: "true"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      # ── [1] Checkout（tag 发布要全 history；fetch-tags 让 --verify-tag 可用）──
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ── [2] 解析 tag / 渠道 / BUILD / 发版说明 ──────────────────────
      # 三个来源各管一件事，缺一不可：
      #   tag        → 版本号与渠道（发布语义）
      #   BUILD      → versionCode 与标题里的构建号（构建标识）
      #   news-<ver> → Release 正文（发版说明，必须是写好的，不自动生成）
      - name: Resolve tag, channel, BUILD and release notes
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:?GITHUB_REF_NAME 为空}"
          prefix="${tag%%-*}"      # 第一个 '-' 之前 = 渠道前缀
          version="${tag#*-}"      # 第一个 '-' 之后 = 版本号

          # 渠道语义与桌面 release.yml 一致：Stable/Safe 走正式，Beta/UnStable 走测试。
          case "$prefix" in
            Stable|Safe)   channel="Stable" ;;
            Beta|UnStable) channel="Beta" ;;
            *)
              echo "::error::tag '$tag' 缺少渠道前缀（Stable-/Safe-/Beta-/UnStable-）"
              exit 1
              ;;
          esac

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::从 tag '$tag' 解析出的版本号 '$version' 不是 X.Y.Z"
            exit 1
          fi

          # BUILD 只读：这里读到的就是 gradle 写进 APK 的 versionCode。
          build="$(tr -d '[:space:]' < BUILD)"
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then
            echo "::error::仓库根 BUILD 内容不是整数：'$build'"
            exit 1
          fi

          news="docs/compose/releases/news-${version}.md"
          if [[ ! -f "$news" ]]; then
            echo "::error::找不到 $news"
            echo "发布前需要先在 docs/compose/releases/ 下写好这一版的说明。现有文件："
            ls -1 docs/compose/releases 2>/dev/null || true
            exit 1
          fi

          # 标题格式：2-Pyramid for Android {Stable|Beta} <ver>-BUILD<build>
          if [[ "$channel" == "Beta" ]]; then
            title="2-Pyramid for Android Beta ${version}-BUILD${build}"
            is_beta="true"
          else
            title="2-Pyramid for Android Stable ${version}-BUILD${build}"
            is_beta="false"
          fi

          {
            echo "channel=$channel"
            echo "version=$version"
            echo "build=$build"
            echo "news=$news"
            echo "title=$title"
            echo "is_beta=$is_beta"
            echo "apk_name=2-Pyramid-Android-${version}.apk"
          } >> "$GITHUB_OUTPUT"

          echo "tag=$tag  版本=$version  渠道=$channel  BUILD=$build"
          echo "标题=$title"
          echo "发版说明=$news（$(wc -c < "$news") 字节）"

      # ── [3] 版本一致性校验 ─────────────────────────────────────────
      # 版本号散落在 versionName / README 徽章 / news 文件 / tag 四处，漏改一处就会
      # 出现「tag 说 2.1.0，APK 说 2.0.x」。校验逻辑集中在 tools/set_version.py，
      # 本地与 CI 跑同一条命令（本地 Windows 是 `python tools/set_version.py --check`；
      # ubuntu runner 上保证存在的是 `python3`，没有裸 `python` 别名）。
      # GITHUB_REF_NAME 由 Actions 自动注入，脚本会把它当发布 tag 与文件内版本对齐。
      - name: Check version consistency
        shell: bash
        run: python3 tools/set_version.py --check

      # ── [4] 把 BUILD 传给 Rust 编译 ────────────────────────────────
      # convert-core/build.rs 的 BUILD_NUMBER 默认 21000；发布时用仓库 BUILD 覆盖，
      # 否则产物里 2pyr-gen.json 的 generator_build / Bedrock manifest 版本会与
      # versionCode 对不上（都是"构建号"，却来自两个地方）。
      - name: Export BUILD_NUMBER for the Rust build
        run: echo "BUILD_NUMBER=${{ steps.meta.outputs.build }}" >> "$GITHUB_ENV"

      # ── [5] 工具链：Rust + JDK + Android SDK/NDK + Gradle ──────────
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: convert-core
          cache-on-failure: true

      - name: Install cargo-ndk + uniffi-bindgen
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --features=cli --locked
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK/平台必须与 2fa-android/gradle.properties 的 android.ndkVersion（27.3.13750724）
      # 和 compileSdk（37）一致；android-actions/setup-android@v3 **没有** ndk-version /
      # sdk-version 输入（会被忽略），NDK 与平台都必须写进 `packages` 交给 sdkmanager 安装。
      # `platforms;android-37.0` 是 sdkmanager 的真实包 id（本地 package.xml 同口径）。
      - name: Set up Android SDK (NDK 27.3 + platform 37)
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37.0
            build-tools;37.0.0
            ndk;27.3.13750724

      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      # ── [6] 抽 JNA libjnidispatch.so 到 jniLibs ────────────────────
      # jna jar 不含 Android natives，需从 jna-platform aar 的 jni/<abi>/ 抽出来；
      # jniLibs 整个目录 gitignore，CI 每次都要做（本地由构建脚本手动抽）。
      - name: Extract JNA libjnidispatch.so
        env:
          JNA_VERSION: "5.14.0"
          JNA_ABI_DIR: "arm64-v8a"
        run: |
          set -euo pipefail
          JNI_LIBS="2fa-android/app/src/main/jniLibs/$JNA_ABI_DIR"
          mkdir -p "$JNI_LIBS"
          curl -fL --retry 3 \
            -o /tmp/jna-platform.aar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna-platform/${JNA_VERSION}/jna-platform-${JNA_VERSION}.aar"
          unzip -j -o /tmp/jna-platform.aar \
            "jni/${JNA_ABI_DIR}/libjnidispatch.so" \
            -d "$JNI_LIBS"
          ls -la "$JNI_LIBS"

      # ── [7] 编译 Rust → .so + 生成 UniFFI Kotlin binding ───────────
      - name: Build convert-core (Rust → .so + Kotlin binding)
        run: bash tools/build-rust-android.sh arm64-v8a

      # ── [8] assembleRelease ───────────────────────────────────────
      # 发行 APK 的签名密钥是**仓库内公开的 debug keystore** `tools/ci/debug.keystore`
      # （alias/password 为 Android 标准 debug 值，见 app/build.gradle.kts）：CI 与本地
      # 共用同一把密钥，跨版本签名稳定、可覆盖安装；它不是商店发行密钥，完整性以
      # Release 附带的 .apk.sha256 为准（legal/SECURITY.md）。因此这里**不需要**现场生成密钥。
      - name: Build release APK (signed with the project debug keystore)
        working-directory: 2fa-android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # ── [9] 重命名 + 计算 SHA-256 ──────────────────────────────────
      # 资产名带版本号（不是 versionCode），用户下载后能直接看出是哪个版本；
      # 校验文件用 sha256sum 标准格式 `<hash>  <filename>`，`sha256sum -c` 可直接验。
      - name: Rename APK and compute SHA-256
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          src_dir="2fa-android/app/build/outputs/apk/release"
          apk="$(find "$src_dir" -maxdepth 1 -name '*.apk' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "::error::$src_dir 下没有找到 release APK"
            ls -la "$src_dir" 2>/dev/null || true
            exit 1
          fi

          mkdir -p dist
          name="${{ steps.meta.outputs.apk_name }}"
          cp "$apk" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )

          echo "apk=dist/$name" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$name.sha256" >> "$GITHUB_OUTPUT"
          ls -l dist
          echo "--- sha256 ---"
          cat "dist/$name.sha256"

      # ── [10] 创建 GitHub Release ───────────────────────────────────
      # 资产只发 APK + 同名 .sha256（应用内没有自动更新，用户手动下载侧载）。
      # 同一个 tag 已有 Release 就停下，避免重跑覆盖已发布内容 —— 与桌面版同策略。
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag 已存在 Release。要改内容请先在网页上删除它，或手动编辑。"
            exit 1
          fi

          args=(
            release create "$tag"
            --title "${{ steps.meta.outputs.title }}"
            --verify-tag
          )
          # Beta/UnStable → prerelease；Stable/Safe → latest。
          if [[ "${{ steps.meta.outputs.is_beta }}" == "true" ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi

          # Release 正文 = 仓库内 news 文件 + **本次 CI 构建产物的真实 SHA-256**。
          # （本地产物与 CI 产物的哈希天然不同；校验值以实际发布的资产为准，
          #   同时仍有同名 `.apk.sha256` 资产可 `sha256sum -c`。）
          notes="$RUNNER_TEMP/release-notes.md"
          sha_hex="$(awk '{print $1}' "${{ steps.pack.outputs.sha }}")"
          {
            cat "${{ steps.meta.outputs.news }}"
            echo ""
            echo "---"
            echo ""
            echo "**本次 CI 构建产物 SHA-256**（\`${{ steps.meta.outputs.apk_name }}\`）："
            echo ""
            echo "\`$sha_hex\`"
          } > "$notes"

          gh "${args[@]}" --notes-file "$notes" \
            "${{ steps.pack.outputs.apk }}" \
            "${{ steps.pack.outputs.sha }}"

      # ── [11] 步骤摘要（给人看的发布回执）──────────────────────────
      - name: Write release summary
        shell: bash
        run: |
          {
            echo "### 已发布 ${{ steps.meta.outputs.title }}"
            echo ""
            echo "- tag：\`${{ github.ref_name }}\`（渠道前缀 ${{ steps.meta.outputs.channel }}）"
            echo "- BUILD：\`${{ steps.meta.outputs.build }}\`（versionCode，取自仓库根 BUILD）"
            echo "- 正文：\`${{ steps.meta.outputs.news }}\`"
            echo "- 资产：\`${{ steps.meta.outputs.apk_name }}\` + 同名 \`.sha256\`"
            echo "- 本仓库**没有应用内自动更新**；升级 = 手动下载新 APK 侧载覆盖。"
          } >> "$GITHUB_STEP_SUMMARY"
