# ===============================================================
# 2-Pyramid For Android — PR / main 验证 workflow
# ===============================================================
# 触发:
#   - pull_request  → 任何对 main 的 PR
#   - push to main  → merge 后
#   - workflow_dispatch → 手动验证
#
# 行为:
#   1. 版本一致性自检（tools/set_version.py --check，无 tag 时不做 tag 对齐）
#   2. 装 Rust toolchain + Android SDK + NDK
#   3. 跑 cargo 编译 + UniFFI binding 生成（tools/build-rust-android.sh）
#   4. 跑 ./gradlew :app:assembleDebug
#   5. 上传 APK 作为 artifact(只保留 7 天)
#
# 不上传 release(那是 release.yml 的活)。
# 不签名 release build(避免和 release workflow 串号,以及 PR 不应该有 release 权限)。
# BUILD 只读：versionCode 来自仓库根 BUILD，构建不写回任何版本文件。
# ===============================================================

name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 同一个 PR 多 push 只跑最新的那个
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认 token 只能 read;我们要写 cache 写 artifact,内置 GITHUB_TOKEN 够用
permissions:
  contents: read

jobs:
  build-debug:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # 关键:让 Gradle 跳过自己的 buildRustAndroid task,
      # Rust 编译由本 workflow 自己跑(更可控、可 cache)。
      SKIP_RUST_BUILD: "true"
      # 用本地 mirror 加速 Rust crates 拉取
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      # ── [1] Checkout ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── [2] 版本一致性自检 ──────────────────────────────────
      # PR/main 上没有发布 tag（GITHUB_REF_NAME 是 `123/merge` 或 `main`），
      # 脚本会跳过 tag 对齐，只校验 versionName / BUILD / versionCode 读取 /
      # README 徽章 / news 文件的一致性 —— 版本号漏改在这里就能拦住。
      - name: Check version consistency
        run: python3 tools/set_version.py --check

      # ── [3] 工具链:Rust + Android SDK + JDK ──────────────────
      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: convert-core
          cache-on-failure: true

      - name: Install cargo-ndk + uniffi-bindgen
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi
          if ! command -v uniffi-bindgen >/dev/null 2>&1; then
            cargo install uniffi --features=cli --locked
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # NDK/平台必须与 2fa-android/gradle.properties 的 android.ndkVersion（27.3.13750724）
      # 和 compileSdk（37）一致；android-actions/setup-android@v3 **没有** ndk-version /
      # sdk-version 输入（会被忽略），NDK 与平台都必须写进 `packages` 交给 sdkmanager 安装。
      # `platforms;android-37.0` 是 sdkmanager 的真实包 id（本地 package.xml 同口径）。
      # `packages` 必须**单行、空格分隔**：该 action 按空格切分输入后逐个传给 sdkmanager，
      # 多行 block scalar 会被当成一个包名（实测 CI 报 `Failed to find package 'platform-tools\n…'`）。
      - name: Set up Android SDK (NDK 27.3 + platform 37)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.3.13750724"

      # ── [4] 装 Gradle 缓存 helper ─────────────────────────────
      - name: Setup Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          gradle-home-cache-cleanup: true

      # ── [5] 抽 JNA libjnidispatch.so 到 jniLibs ──────────────
      # 项目 libs.versions.toml 注:jna jar 不含 android natives,
      # 需要从 jna-platform aar 抽 libjnidispatch.so 到 jniLibs/<abi>/。
      # CI 必做(本地用户也手动从 jar 抽,gitignore 整个 jniLibs 目录)。
      - name: Extract JNA libjnidispatch.so
        env:
          JNA_VERSION: "5.14.0"
          JNA_ABI_DIR: "arm64-v8a"
        run: |
          set -euo pipefail
          JNI_LIBS="2fa-android/app/src/main/jniLibs/$JNA_ABI_DIR"
          mkdir -p "$JNI_LIBS"
          # JNA 的 jar 只带桌面 natives；Android natives 在 Maven Central 的
          # `net.java.dev.jna:jna:<ver>.aar`（`jni/<abi>/libjnidispatch.so`）里，
          # 不是 jna-platform（那个没有 .aar，实测 404）。
          curl -fL --retry 3 \
            -o /tmp/jna.aar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/${JNA_VERSION}/jna-${JNA_VERSION}.aar"
          unzip -j -o /tmp/jna.aar \
            "jni/${JNA_ABI_DIR}/libjnidispatch.so" \
            -d "$JNI_LIBS"
          ls -la "$JNI_LIBS"
          echo "libjnidispatch.so extracted OK"

      # ── [6] 把 BUILD 传给 Rust 编译 ──────────────────────────
      # convert-core/build.rs 的 BUILD_NUMBER 默认 21000；这里用仓库 BUILD 覆盖，
      # 让测试与产物里的构建号与 versionCode 同源（与 release.yml 一致）。
      - name: Export BUILD_NUMBER for the Rust build
        run: echo "BUILD_NUMBER=$(tr -d '[:space:]' < BUILD)" >> "$GITHUB_ENV"

      # ── [7] 编译 Rust + UniFFI binding ───────────────────────
      - name: Build convert-core (Rust → .so + Kotlin binding)
        run: bash tools/build-rust-android.sh arm64-v8a

      # ── [8] Gradle assembleDebug ─────────────────────────────
      - name: Build debug APK
        working-directory: 2fa-android
        env:
          # 关掉 Gradle 的更新检查,加速
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # ── [9] 上传 APK 作为 artifact ───────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: 2fa-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
